# This file is an operator-facing release record, not runtime configuration.
# Real Coinbase and Binance QA/UAT remain blocked until every automated gate
# below passes and every manual evidence item is attached to the release bundle.

version = "V14.0"
qaUatStatus = "blocked"
qaUatBlocker = "V12, V13, and V14 automated gates plus manual operational evidence must be complete before real Coinbase or Binance QA/UAT."

